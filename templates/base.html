<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlucoTrend{% endblock %} · GlucoTrend</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 48 24" width="34" height="17">
                    <polyline points="0,18 8,18 12,4 18,20 24,10 30,16 36,8 48,8"
                              fill="none" stroke="currentColor" stroke-width="2.5"
                              stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span>GlucoTrend</span>
        </div>
        <nav class="site-nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('dataset') }}">Dataset</a>
            <a href="{{ url_for('preprocessing') }}">Preprocessing</a>
            <a href="{{ url_for('visualization') }}">Visualization</a>
            <a href="{{ url_for('models') }}">Models</a>
            <a href="{{ url_for('prediction') }}">Prediction</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
    </header>

    <main class="page-wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>GlucoTrend &middot; CGM forecasting &amp; glucose-range classification project</p>
    </footer>
</body>
</html>
