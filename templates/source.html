{% extends "base.html" %}
{% block title %}{{ filename }}{% endblock %}
{% block content %}
<section class="hero source-hero">
    <span class="eyebrow">Source code · read-only preview</span>
    <h1>{{ filename }}</h1>
    <p class="lede">Project Python source as it exists in the workspace.</p>
    <div class="source-actions"><a class="btn btn-secondary" href="{{ url_for('library') }}#source-code">← Back to code library</a><a class="btn btn-primary" href="{{ url_for('source_download', filename=filename) }}">Download file ↓</a><button class="btn btn-secondary" type="button" id="copy-source">Copy code</button></div>
</section>
<div class="source-window"><div class="source-window-bar"><span><i></i><i></i><i></i></span><b>{{ filename }}</b><small>PYTHON</small></div><pre><code id="source-code">{{ source_code }}</code></pre></div>
<p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
<script>
document.getElementById('copy-source').addEventListener('click', async () => {
    const status = document.getElementById('copy-status');
    try {
        await navigator.clipboard.writeText(document.getElementById('source-code').textContent);
        status.textContent = 'Source copied to clipboard.';
    } catch (_) {
        status.textContent = 'Clipboard access is unavailable in this browser.';
    }
});
</script>
{% endblock %}
